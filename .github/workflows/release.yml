name: Release to AMO

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect version bump
        id: version
        run: |
          NEW=$(jq -r .version extension/manifest.json)
          OLD=$(git show HEAD~1:extension/manifest.json 2>/dev/null | jq -r .version 2>/dev/null || echo "")
          echo "new=$NEW" >> "$GITHUB_OUTPUT"
          if [ "$NEW" = "$OLD" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "No version change ($NEW unchanged) — skipping release."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Version bumped: ${OLD:-<none>} → $NEW"
          fi

      - name: Setup Node
        if: steps.version.outputs.skip == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install + build extension xpi
        if: steps.version.outputs.skip == 'false'
        run: |
          npm ci
          npm run package

      - name: Build source zip
        if: steps.version.outputs.skip == 'false'
        run: |
          VERSION=${{ steps.version.outputs.new }}
          git archive --format=zip \
            --prefix=crumb-${VERSION}-source/ \
            -o web-ext-artifacts/crumb-${VERSION}-source.zip HEAD

      - name: Upload to AMO
        if: steps.version.outputs.skip == 'false'
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: node scripts/amo-upload.js

      - name: Create GitHub release
        if: steps.version.outputs.skip == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.new }}
          name: v${{ steps.version.outputs.new }}
          generate_release_notes: true
          files: |
            web-ext-artifacts/crumb-${{ steps.version.outputs.new }}.zip
            web-ext-artifacts/crumb-${{ steps.version.outputs.new }}-source.zip
