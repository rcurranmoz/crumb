name: Release to AMO

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detect version bump
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NEW=$(jq -r .version extension/manifest.json)
          echo "new=$NEW" >> "$GITHUB_OUTPUT"
          if gh release view "v${NEW}" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Release v${NEW} already exists — skipping."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Release v${NEW} not found — proceeding."
          fi

      - name: Setup Node
        if: steps.version.outputs.skip == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install + build extension xpi
        if: steps.version.outputs.skip == 'false'
        run: |
          npm ci
          npm run package

      - name: Build source zip
        if: steps.version.outputs.skip == 'false'
        run: |
          VERSION=${{ steps.version.outputs.new }}
          git archive --format=zip \
            --prefix=crumb-${VERSION}-source/ \
            -o web-ext-artifacts/crumb-${VERSION}-source.zip HEAD

      - name: Upload to AMO
        if: steps.version.outputs.skip == 'false'
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: node scripts/amo-upload.js

      - name: Create GitHub release
        if: steps.version.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=${{ steps.version.outputs.new }}
          gh release create "v${VERSION}" \
            --title "v${VERSION}" \
            --generate-notes \
            "web-ext-artifacts/crumb-${VERSION}.zip" \
            "web-ext-artifacts/crumb-${VERSION}-source.zip"
